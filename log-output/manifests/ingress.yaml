apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-output
  namespace: exercises
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: exercises-pingpong-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: logoutput.local
      http:
        paths:
          - path: /pingpong
            pathType: Prefix
            backend:
              service:
                name: pingpong
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-output
                port:
                  number: 80
