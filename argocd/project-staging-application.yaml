apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-staging
  namespace: argocd
spec:
  destination:
    namespace: project-staging
    server: https://kubernetes.default.svc
  project: default
  source:
    path: project/overlays/staging
    repoURL: https://github.com/LaomaiAI/devops-with-kubernetes-config.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
