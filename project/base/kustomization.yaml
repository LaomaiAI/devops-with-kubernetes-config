apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared base for production and staging. It aggregates the four
# component kustomizations; each lists only its own files, so no
# resource file lives outside the kustomization that lists it.
resources:
- ../manifests
- ../broadcaster/manifests
- ../message-receiver/manifests
- ../todo-backend/manifests
