apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project
  namespace: project
spec:
  ingressClassName: traefik
  rules:
    - host: project.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: project
                port:
                  number: 80
