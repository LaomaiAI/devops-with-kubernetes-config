apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production: tagged commits only. Main project runs 3 replicas and the
# todo-db is backed up daily (CronJob + PVC). Broadcaster forwards as usual.
namespace: project
resources:
- ../../base
- namespace.yaml
- db-backup-cronjob.yaml
- db-backup-pvc.yaml
patches:
- path: project-replicas.yaml
  target:
    kind: Deployment
    name: project
    namespace: project
